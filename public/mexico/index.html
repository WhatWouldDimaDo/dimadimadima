<!DOCTYPE html>
<html lang="en">
<head>
<base href="/mexico/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Condesa Days — a family guide to Mexico City</title>
<meta name="description" content="A working guide to Mexico City with young children — parks, markets, comida, and half-day outings, built around an 11 AM nap and a 1 PM lunch. Browse, filter, and drag activities into a shared plan.">
<meta name="theme-color" content="#1E4A44" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E4A44" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Condesa Days">
<meta property="og:title" content="Condesa Days — a family guide to Mexico City">
<meta property="og:description" content="Parks, markets, comida and half-day outings in Mexico City, organised around a nap and a late lunch.">
<meta property="og:url" content="https://dimadimadima.com/mexico/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=Karla:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="chat.css">
<link rel="icon" href="logo.svg">
<link rel="apple-touch-icon" href="logo.svg">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <div class="bar">
    <button class="brand" id="brandHome" type="button" aria-label="Back to the top">
      <img class="brand-mark" src="logo.svg" alt="" width="34" height="34">
      <span class="brand-text">
        <strong>Condesa Days</strong>
        <em id="viewLabel">Schedule</em>
      </span>
    </button>
    <div class="bar-actions">
      <button class="icon-btn" id="searchBtn" type="button" aria-label="Search"
              aria-haspopup="dialog" aria-controls="gsResults" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu"
              aria-haspopup="menu" aria-controls="menuPanel" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="gs-panel" id="gsResults" hidden role="dialog" aria-label="Search">
  <div class="gs-searchbar">
    <svg class="gs-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" id="gq" autocomplete="off"
           placeholder="Search everything — places, food, neighbourhoods…"
           aria-label="Search everything" aria-controls="gsList" role="combobox" aria-expanded="false">
    <button class="gs-clear" id="gsClear" type="button" aria-label="Clear search" hidden>✕</button>
  </div>
  <div class="gs-list" id="gsList" role="listbox" aria-label="Search results"></div>
</div>

<nav class="menu-panel" id="menuPanel" hidden role="menu" aria-label="Views">
  <button class="menu-item" data-view="plan" role="menuitem" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
    <span>Schedule</span>
  </button>
  <button class="menu-item" data-view="browse" role="menuitem" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/></svg>
    <span>Everything</span>
  </button>
  <button class="menu-item" data-view="guides" role="menuitem" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5v-17Z"/><path d="M4 19a2.5 2.5 0 0 1 2.5-2.5H20"/></svg>
    <span>Guides</span>
  </button>
  <button class="menu-item" data-view="map" role="menuitem" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.4"/></svg>
    <span>Map</span>
  </button>
  <button class="menu-item" data-view="chat" role="menuitem" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
    <span>Chat</span>
  </button>
  <button class="menu-item" id="menuAbout" role="menuitem" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16.5"/><circle cx="12" cy="7.5" r="1"/></svg>
    <span>About</span>
  </button>
</nav>

<main id="main">

  <!-- ───────────────────────── PLAN ───────────────────────── -->
  <section class="view is-on" id="view-plan" role="tabpanel" aria-label="Plan">
    <div class="daystrip" id="daystrip" role="tablist" aria-label="Days"></div>

    <div class="dayhead">
      <div>
        <h1 id="dayTitle">—</h1>
        <p class="daysub" id="daySub"></p>
      </div>
      <div class="dayhead-actions">
        <button class="ghost-btn" id="shareBtn" type="button">Share plan</button>
        <button class="ghost-btn" id="resetDayBtn" type="button">Reset day</button>
      </div>
    </div>

    <div class="fixedrow" id="fixedRow"></div>

    <ol class="timeline" id="timeline"></ol>

    <p class="plan-hint" id="planHint">
      Tap <strong>Browse</strong> to find places, then <strong>＋</strong> to drop one into a slot.
      Drag the handle on any card to move it. Everything saves on this device.
    </p>
  </section>

  <!-- ──────────────────────── BROWSE ──────────────────────── -->
  <section class="view" id="view-browse" role="tabpanel" aria-label="Browse" hidden>
    <div class="filters">
      <div class="filterbar">
        <button class="filtertoggle" id="browseFilterToggle" type="button" aria-expanded="false" aria-controls="browseFilterPanel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6.5 8v6l-3 1.5v-7.5L4 5Z"/></svg>
          <span id="browseFilterLabel">Filter &amp; sort</span>
        </button>
        <span class="resultline" id="resultCount">—</span>
      </div>
      <div class="filterpanel" id="browseFilterPanel" hidden>
        <div class="withinwrap">
          <input type="search" id="browseSearch" autocomplete="off"
                 placeholder="Search within these results…" aria-label="Search within these results">
        </div>
        <div class="densityrow" role="group" aria-label="How much detail to show">
          <button class="dbtn" data-density="list" type="button">Compact</button>
          <button class="dbtn is-on" data-density="card" type="button">Cards</button>
          <button class="dbtn" data-density="full" type="button">Full detail</button>
        </div>
        <div class="chiprow" id="chipsWhen"  aria-label="Filter by time of day"></div>
        <div class="chiprow" id="chipsSrc"   aria-label="Filter by where the recommendation came from"></div>
        <div class="chiprow" id="chipsCat"   aria-label="Filter by category"></div>
        <div class="chiprow" id="chipsTag"   aria-label="Filter by feature"></div>
        <div class="filterfoot">
          <button class="linky" id="clearFilters" type="button">Clear filters</button>
        </div>
      </div>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <!-- ───────────────────────── GUIDES ──────────────────────── -->
  <section class="view" id="view-guides" role="tabpanel" aria-label="Guides" hidden>
    <div class="guides-intro">
      <h1>Guides</h1>
      <p>Longer reads on the things that take a bit of explaining.</p>
    </div>
    <div class="guidegrid" id="guideGrid"></div>
    <article class="guide-read" id="guideRead" hidden></article>
  </section>

  <!-- ────────────────────────── MAP ───────────────────────── -->
  <section class="view" id="view-map" role="tabpanel" aria-label="Map" hidden>
    <div class="filters">
      <div class="filterbar">
        <button class="filtertoggle" id="mapFilterToggle" type="button" aria-expanded="false" aria-controls="mapFilterPanel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6.5 8v6l-3 1.5v-7.5L4 5Z"/></svg>
          <span id="mapFilterLabel">Filter &amp; sort</span>
        </button>
        <span class="resultline" id="mapCount">—</span>
      </div>
      <div class="filterpanel" id="mapFilterPanel" hidden>
        <div class="chiprow" id="mapChipsCat"     aria-label="Filter map by category"></div>
        <div class="chiprow" id="mapChipsSrc"     aria-label="Filter map by where the recommendation came from"></div>
        <div class="chiprow" id="mapChipsVisited" aria-label="Filter map by visited"></div>
        <div class="filterfoot">
          <button class="linky" id="mapClearFilters" type="button">Clear filters</button>
        </div>
      </div>
    </div>
    <div class="maplegend" id="mapLegend"></div>
    <div id="map"></div>
    <div class="maprow">
      <button class="ghost-btn" id="locateBtn" type="button" aria-pressed="false">📍 Where am I</button>
      <p class="locstatus" id="locStatus" hidden></p>
    </div>
    <div class="mapcard" id="mapCard" hidden></div>
  </section>

  <!-- ────────────────────────── CHAT ───────────────────────── -->
  <section class="view" id="view-chat" role="tabpanel" aria-label="Chat" hidden></section>

</main>

<!-- place detail sheet -->
<div class="sheet-scrim" id="sheetScrim" hidden></div>
<aside class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-label="Place details">
  <button class="sheet-close" id="sheetClose" type="button" aria-label="Close">✕</button>
  <div class="sheet-body" id="sheetBody"></div>
</aside>

<!-- add-to-day picker -->
<div class="sheet-scrim" id="pickScrim" hidden></div>
<aside class="sheet sheet--pick" id="pick" hidden aria-modal="true" role="dialog" aria-label="Add to a day">
  <button class="sheet-close" id="pickClose" type="button" aria-label="Close">✕</button>
  <div class="sheet-body" id="pickBody"></div>
</aside>

<div class="toast" id="toast" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="data.js"></script>
<script src="guides.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
</body>
</html>
